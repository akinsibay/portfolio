<app-site-nav />

<main class="page-shell" aria-label="Portfolio content">
  <app-about-section />
  <app-projects-section />
  <app-focus-section />
  <app-expertise-section />
</main>

<footer class="site-footer">
  <div class="footer-cta">
    <div class="container footer-cta-inner">
      <p class="footer-prompt">Feel free to reach out for opportunities and collaborations.</p>

      <nav class="footer-links" aria-label="Contact links">
        @for (link of contactLinks; track link.href) {
        <a class="btn btn-secondary" [href]="link.href" [attr.target]="link.external ? '_blank' : null"
          [attr.rel]="link.external ? 'noreferrer' : null">
          <img [src]="iconUrl(link.iconSlug, link.iconUrl)" alt="" aria-hidden="true" loading="lazy" decoding="async">
          <span>{{ link.label }}</span>
        </a>
        }
      </nav>
    </div>
  </div>

  <div class="footer-bar">
    <div class="container">
      <p class="footer-copy">© {{ currentYear }} - Developed By Akın Şibay - All rights reserved.</p>
    </div>
  </div>
</footer>
