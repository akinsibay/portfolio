<section class="section-frame focus-section" id="focus" aria-labelledby="focus-title">
  <div class="container">
    <div class="section-head" appReveal>
      <h2 id="focus-title" class="section-heading">What I Focus On</h2>
    </div>

    <p class="section-description focus-description" appReveal="60">
      Core engineering principles I follow when building reliable, production-ready software systems.
    </p>

    <div class="focus-grid" role="list" aria-label="Focus areas">
      @for (item of items; track item.title; let i = $index) {
      <article class="card focus-card" role="listitem" [appReveal]="40 + i * 50" [style.--card-accent]="item.accent">
        <div class="focus-cover" aria-hidden="true">
          <span class="focus-icon-wrap">
            <span class="focus-icon" [style.--icon-url]="'url(' + item.iconUrl + ')'"></span>
          </span>
        </div>

        <div class="focus-body">
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
        </div>
      </article>
      }
    </div>
  </div>
</section>
